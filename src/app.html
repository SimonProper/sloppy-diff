<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// the theme picked in ThemeToggle, or the OS colour scheme, before first paint, see layout.css
			(() => {
				const query = matchMedia('(prefers-color-scheme: dark)');
				const picked = () => {
					try {
						return localStorage.getItem('sloppy-diff:theme');
					} catch {
						return null;
					}
				};
				const apply = () => {
					const theme = picked();
					document.documentElement.classList.toggle(
						'dark',
						theme ? theme === 'dark' : query.matches
					);
				};
				apply();
				query.addEventListener('change', apply);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
